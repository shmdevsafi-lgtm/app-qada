apply plugin: 'com.android.application'

android {
    namespace "com.shm.qada"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shm.qada"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode/versionName are overridden by the CI workflow at
        // build time (see .github/workflows/android-build.yml) using
        // -PversionCode/-PversionName so each build produces an
        // incrementing, traceable version without editing this file
        // for every release. These defaults are only used for local
        // `./gradlew assembleDebug` runs outside CI.
        versionCode project.hasProperty('versionCode') ? (project.versionCode as Integer) : 1
        versionName project.hasProperty('versionName') ? project.versionName : "2.0.0-dev"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // registerForActivityResult / ActivityResultContracts, used in
    // MainActivity.java to request the CAMERA runtime permission.
    implementation "androidx.activity:activity:1.9.3"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
